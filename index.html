<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glasses VR | Product Designer Experience</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #05070f;
      }

      .overlay {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #f4f8ff;
        z-index: 10;
        pointer-events: none;
      }

      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(3, 12, 28, 0.65);
        border: 1px solid rgba(124, 174, 255, 0.45);
        backdrop-filter: blur(8px);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="pill">Glasses VR • Product Designer Sandbox</div>
      <div class="pill">Look around + move with WASD / arrows</div>
    </div>

    <a-scene background="color: #060b1a" fog="type: exponential; color: #060b1a; density: 0.03">
      <a-assets>
        <img id="grid" src="https://cdn.aframe.io/a-painter/images/floor.jpg" />
      </a-assets>

      <a-entity light="type: ambient; color: #6c89ff; intensity: 0.45"></a-entity>
      <a-entity light="type: directional; color: #d7e5ff; intensity: 0.9" position="-1 3 2"></a-entity>
      <a-entity light="type: point; color: #6ed8ff; intensity: 1.4; distance: 25" position="0 4 -5"></a-entity>

      <a-plane
        position="0 0 -6"
        rotation="-90 0 0"
        width="45"
        height="45"
        material="src: #grid; repeat: 20 20; roughness: 1; metalness: 0"
      ></a-plane>

      <a-sky color="#04060f"></a-sky>

      <a-entity id="experience-cluster" position="0 0 -8">
        <a-cylinder
          position="0 0.7 0"
          radius="1.8"
          height="0.15"
          color="#10264e"
          material="metalness: 0.5; roughness: 0.2"
        ></a-cylinder>

        <a-sphere
          position="0 1.55 0"
          radius="0.9"
          color="#79bbff"
          material="shader: standard; emissive: #3366aa; emissiveIntensity: 0.35; metalness: 0.45"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"
        ></a-sphere>

        <a-ring
          position="0 1.55 0"
          radius-inner="1.05"
          radius-outer="1.12"
          rotation="90 0 0"
          color="#3d77d6"
          animation="property: rotation; to: 90 360 0; loop: true; dur: 8000; easing: linear"
        ></a-ring>
      </a-entity>

      <a-entity position="-4 1.8 -11">
        <a-plane width="2.5" height="1.4" color="#11203f" material="opacity: 0.9"></a-plane>
        <a-text
          value="Research Hub\n- User goals\n- Pain points\n- Task map"
          align="left"
          width="2.2"
          color="#d7e7ff"
          position="-1.15 0.42 0.02"
        ></a-text>
      </a-entity>

      <a-entity position="0 1.8 -12">
        <a-plane width="2.5" height="1.4" color="#11203f" material="opacity: 0.9"></a-plane>
        <a-text
          value="Prototype Lab\n- Interaction flow\n- States + transitions\n- Handoff notes"
          align="left"
          width="2.2"
          color="#d7e7ff"
          position="-1.15 0.42 0.02"
        ></a-text>
      </a-entity>

      <a-entity position="4 1.8 -11">
        <a-plane width="2.5" height="1.4" color="#11203f" material="opacity: 0.9"></a-plane>
        <a-text
          value="Validation Deck\n- Test scripts\n- Metrics wall\n- Next iterations"
          align="left"
          width="2.2"
          color="#d7e7ff"
          position="-1.15 0.42 0.02"
        ></a-text>
      </a-entity>

      <a-entity id="interactables">
        <a-box
          position="-2.5 1 -6.5"
          depth="0.9"
          height="0.9"
          width="0.9"
          color="#6b96ff"
          animation__pulse="property: scale; dir: alternate; dur: 1200; loop: true; to: 1.12 1.12 1.12"
        ></a-box>

        <a-octahedron
          position="2.8 1.2 -7"
          radius="0.7"
          color="#7de3ff"
          animation="property: rotation; to: 360 360 360; loop: true; dur: 9000; easing: linear"
        ></a-octahedron>

        <a-torus-knot
          position="0 2.5 -9"
          radius="0.45"
          radius-tubular="0.08"
          p="2"
          q="5"
          color="#b286ff"
          material="emissive: #773cb9; emissiveIntensity: 0.25"
          animation="property: rotation; to: 0 360 360; loop: true; dur: 11000; easing: linear"
        ></a-torus-knot>
      </a-entity>

      <a-entity position="0 1.6 3">
        <a-camera wasd-controls="acceleration: 30" look-controls="pointerLockEnabled: true">
          <a-cursor
            color="#9ad0ff"
            fuse="true"
            fuse-timeout="1200"
            material="shader: flat"
            geometry="radiusInner: 0.008; radiusOuter: 0.014"
          ></a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
